name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from main at / with custom domain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if ! gh api "repos/${repo}/pages" >/tmp/pages.json 2>/tmp/pages.err; then
            gh api --method POST "repos/${repo}/pages" \
              -H "Accept: application/vnd.github+json" \
              -f build_type='legacy' \
              -f source[branch]='main' \
              -f source[path]='/'
          fi
          gh api --method PUT "repos/${repo}/pages" \
            -H "Accept: application/vnd.github+json" \
            -f cname='aftertheshow.shop' \
            -f source[branch]='main' \
            -f source[path]='/'
          gh api "repos/${repo}/pages"
