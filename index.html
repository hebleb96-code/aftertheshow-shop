<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>After the Show — Men's LA Streetwear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elevated: #121214;
      --bg-card: #161618;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f2efe8;
      --muted: #8a8680;
      --dim: #5c5954;
      --accent: #c4a882;
      --accent-soft: rgba(196, 168, 130, 0.15);
      --danger: #b85c4a;
      --radius: 2px;
      --max: 1120px;
      --font-sans: "DM Sans", system-ui, sans-serif;
      --font-serif: "Instrument Serif", Georgia, serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font-sans); background: var(--bg); color: var(--text); line-height: 1.5; font-weight: 400; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; color: inherit; border: none; background: none; }
    img { display: block; max-width: 100%; }
  </style>
</head>
<body>INCOMPLETE_DO_NOT_KEEP</body>
</html>
